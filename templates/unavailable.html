<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LocalScope - No Account Available</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: grid;
            place-items: center;

            background: #090d14;
            color: #f3f6fa;

            font-family:
                Inter,
                system-ui,
                sans-serif;
        }

        .card {
            width: min(
                520px,
                calc(100% - 32px)
            );

            padding: 38px;

            background: #111823;

            border: 1px solid #222d3d;
            border-radius: 16px;

            text-align: center;
        }

        .logo {
            width: 46px;
            height: 46px;

            display: grid;
            place-items: center;

            margin: 0 auto 20px;

            border-radius: 12px;

            background: #5577ff;

            font-weight: 800;
        }

        h1 {
            font-size: 24px;
        }

        p {
            margin-top: 12px;

            color: #98a6b8;

            line-height: 1.6;
        }

        button {
            margin-top: 24px;

            padding: 10px 18px;

            border: 0;
            border-radius: 8px;

            background: #5577ff;
            color: white;

            font-weight: 600;

            cursor: pointer;
        }

    </style>
</head>


<body>

    <main class="card">

        <div class="logo">
            LS
        </div>

        <h1>
            No account available
        </h1>

        <p>
            There is currently no enabled
            Semrush account available.
            Please try again shortly.
        </p>

        <button
            onclick="location.reload()"
        >
            Try Again
        </button>

    </main>

</body>

</html>
