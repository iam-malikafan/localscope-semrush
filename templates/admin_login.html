<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LocalScope Admin Login</title>

    <link
        rel="stylesheet"
        href="/__localscope/static/css/style.css"
    >
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="brand-logo">
                LS
            </div>

            <h1>Admin Login</h1>

            <p>
                Sign in to manage LocalScope.
            </p>

            {% if error %}
                <div class="login-error">
                    {{ error }}
                </div>
            {% endif %}

            <form
                method="post"
                action="/__localscope/login"
            >

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        required
                        autocomplete="username"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Sign In
                </button>

            </form>

        </section>

    </main>

</body>

</html>
