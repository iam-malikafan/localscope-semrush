<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Access Restricted</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background: #0b0f16;
            color: #f5f7fb;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .blocked-card {
            width: 100%;
            max-width: 520px;

            padding: 40px;

            border: 1px solid #202938;
            border-radius: 16px;

            background: #121923;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .icon {
            width: 56px;
            height: 56px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: rgba(255, 94, 94, 0.1);
            color: #ff7676;

            font-size: 26px;
            font-weight: 700;
        }

        h1 {
            margin: 0;

            font-size: 26px;
            font-weight: 700;
        }

        p {
            margin: 12px 0 0;

            color: #98a5b6;

            font-size: 14px;
            line-height: 1.6;
        }

        .actions {
            margin-top: 28px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 11px 18px;

            border: 0;
            border-radius: 8px;

            background: #5577ff;
            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            text-decoration: none;
        }

        .back-button:hover {
            background: #6685ff;
        }

    </style>
</head>


<body>

    <main class="blocked-card">

        <div class="icon">
            !
        </div>

        <h1>
            Access Restricted
        </h1>

        <p>
            This page is not available through LocalScope.
        </p>

        <div class="actions">

            <a
                href="/"
                class="back-button"
            >
                Back to Home
            </a>

        </div>

    </main>

</body>

</html>
